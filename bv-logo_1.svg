<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <!-- BRIEFLY VENTURES — BV Monogram Logo -->
  <!-- Profile photo version: 400x400px square with rounded corners -->
  <!-- Colors: Navy #1A1F4B / Gold #C9A84C / White #FFFFFF -->
  <!-- To use as Instagram circle: crop to circle in-app or use the circle version below -->

  <!-- Background -->
  <rect width="400" height="400" rx="60" fill="#1A1F4B"/>

  <!-- Corner accent marks (gold, subtle) -->
  <rect x="28" y="28" width="24" height="4" rx="2" fill="#C9A84C" opacity="0.6"/>
  <rect x="28" y="28" width="4" height="24" rx="2" fill="#C9A84C" opacity="0.6"/>
  <rect x="348" y="28" width="24" height="4" rx="2" fill="#C9A84C" opacity="0.6"/>
  <rect x="368" y="28" width="4" height="24" rx="2" fill="#C9A84C" opacity="0.6"/>
  <rect x="28" y="368" width="24" height="4" rx="2" fill="#C9A84C" opacity="0.6"/>
  <rect x="28" y="348" width="4" height="24" rx="2" fill="#C9A84C" opacity="0.6"/>
  <rect x="348" y="368" width="24" height="4" rx="2" fill="#C9A84C" opacity="0.6"/>
  <rect x="368" y="348" width="4" height="24" rx="2" fill="#C9A84C" opacity="0.6"/>

  <!-- B — Gold, upper half -->
  <text
    x="200"
    y="215"
    text-anchor="middle"
    dominant-baseline="auto"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="148"
    font-weight="700"
    fill="#C9A84C"
    letter-spacing="-4">B</text>

  <!-- Gold divider line -->
  <line x1="60" y1="222" x2="340" y2="222" stroke="#C9A84C" stroke-width="1.5" opacity="0.45"/>

  <!-- V — White, lower half -->
  <text
    x="200"
    y="358"
    text-anchor="middle"
    dominant-baseline="auto"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="148"
    font-weight="700"
    fill="#FFFFFF"
    letter-spacing="-4">V</text>

</svg>
